services:
  db:
    image: postgres:18
    container_name: vpwa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vpwa
      POSTGRES_PASSWORD: vpwa
      POSTGRES_DB: vpwa
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: